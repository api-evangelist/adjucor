description: >-
  AdjuCor publishes no /.well-known/ document of its own. adjucor.com is a WordPress
  site whose router answers every non-page path — including a random control path —
  with the same 2,679-byte "WordPress > Error" page under HTTP 500, so every named path
  is a hard miss rather than a 404. cloud.adjucor.com is a self-hosted Nextcloud 25.0.3
  appliance (login-walled) that answers the named paths with an explicit JSON
  "<name> not supported" 404; the one 200 it returns, /.well-known/security.txt, is the
  UPSTREAM NEXTCLOUD DEFAULT shipped with that software — it names hackerone.com/nextcloud
  as the contact and policy and expired 2023-04-30 — so it documents Nextcloud GmbH's
  disclosure program, not AdjuCor's, and is recorded here as not-a-real-document for this
  provider. No WellKnown or SecurityTxt pointer is emitted from this probe.
